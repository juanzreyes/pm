<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'" />
  <title>Acerca de PM Pollito</title>
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    html, body { width: 380px; height: 470px; }
    .card { position: absolute; inset: 8px; background: var(--bg); border: 2.5px solid var(--ink); border-radius: 24px;
      box-shadow: 0 4px 0 var(--ink); overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 18px 22px; gap: 6px; -webkit-app-region: drag; animation: pop .3s cubic-bezier(.3, 1.4, .5, 1); }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } }
    .card button, .card a { -webkit-app-region: no-drag; }
    .close { position: absolute; top: 10px; right: 10px; }
    .logo { width: 120px; height: 120px; margin-top: 6px; animation: bob 1.8s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.08)); }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
    h1 { font-size: 24px; font-weight: 900; margin-top: 4px; }
    .ver { font-size: 12px; color: var(--muted); font-weight: 700; }
    .tag { font-size: 13px; margin-top: 2px; }
    .copy { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .row { margin-top: 10px; }
    .donate { margin-top: 10px; background: #ffc439; color: #253b80; border: 2px solid var(--ink); border-radius: 14px; padding: 9px 16px; font-weight: 800; box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
    .donate:hover { filter: brightness(1.05); }
    .donate:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    #upd-msg { font-size: 11.5px; min-height: 16px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <button id="close" class="icon close" title="Cerrar" data-icon="x" aria-label="Cerrar"></button>
    <img class="logo" src="../build/icon.png" alt="PM Pollito" />
    <h1>PM Pollito</h1>
    <div class="ver" id="ver">versión …</div>
    <div class="tag">Tu pollito Project Manager 🐣📋</div>
    <button id="donate" class="donate" title="Abre la página de donación de PayPal">💛 Invítame un café (PayPal)</button>
    <div class="row gap">
      <button id="upd" class="soft" data-icon="refresh">Buscar actualizaciones</button>
    </div>
    <div id="upd-msg"></div>
    <div class="copy">© 2026 PM Pollito · Todos los derechos reservados</div>
  </div>
  <script src="icons.js"></script>
  <script src="../src/i18n-extra.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="about.js"></script>
</body>
</html>
