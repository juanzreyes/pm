<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>PM · Comandos</title>
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    html, body { width: 580px; height: 440px; }
    .card { position: absolute; inset: 8px; background: var(--bg); border: 2.5px solid var(--ink); border-radius: 20px;
      box-shadow: 0 4px 0 var(--ink); display: flex; flex-direction: column; overflow: hidden; animation: pop .18s ease-out; }
    @keyframes pop { from { transform: scale(.97); opacity: 0; } }
    .search { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 2px solid var(--line); color: var(--muted); }
    .search input { border: none; background: transparent; font-size: 17px; padding: 4px 0; flex: 1; }
    .search input:focus, .search input:focus-visible { border: none; outline: none !important; }
    .search .chick { font-size: 22px; }
    #list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
    .it { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; cursor: pointer; font-size: 13.5px; }
    .it .e { width: 24px; text-align: center; font-size: 16px; }
    .it .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sep { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px 2px; }
    .it .h { font-size: 11px; color: var(--muted); }
    .it.sel { background: var(--yellow); color: #3b2f2f; }
    .it.sel .h { color: #5c4a2a; }
    .group { font-size: 10.5px; font-weight: 900; color: var(--muted); padding: 8px 10px 2px; text-transform: uppercase; letter-spacing: .04em; }
    footer { display: flex; gap: 14px; padding: 8px 14px; border-top: 2px solid var(--line); font-size: 11px; color: var(--muted); }
    kbd { font-family: inherit; font-weight: 800; background: var(--card); border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; }
    .empty { padding: 20px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card" role="dialog" aria-label="Paleta de comandos">
    <div class="search">
      <span class="chick">🐣</span>
      <input id="q" placeholder="¿Qué quieres hacer? (pomodoro, informe, reunión…)" autocomplete="off" spellcheck="false" aria-controls="list" />
    </div>
    <div id="list" role="listbox"></div>
    <footer><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> ejecutar</span><span><kbd>Esc</kbd> cerrar</span></footer>
  </div>
  <script src="../src/i18n-extra.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="palette.js"></script>
</body>
</html>
