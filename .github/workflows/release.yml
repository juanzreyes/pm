# Publicar una versión: al subir una etiqueta vX.Y.Z (igual a "version" de package.json)
#   git tag v1.7.0 && git push origin v1.7.0
# corre todos los tests, compila el instalador y lo publica como release en GitHub
# (las copias instaladas se actualizan solas desde ahí). No hace falta GH_TOKEN en tu PC.
#
# Firma opcional: si defines los secretos CSC_LINK (certificado .pfx en base64) y
# CSC_KEY_PASSWORD en Settings → Secrets and variables → Actions, el instalador sale firmado.
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write # para crear el release y subir el instalador

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: La etiqueta coincide con la versión de package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "::error::La etiqueta es $GITHUB_REF_NAME pero package.json dice $v"; exit 1; fi
      - name: Comprobaciones previas (versión nueva y CHANGELOG)
        run: node scripts/check-release.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Identidad de git (los tests crean repos de prueba)
        run: |
          git config --global user.name "PM Pollito CI"
          git config --global user.email "ci@pm-pollito.invalid"
      - run: npm run test:all
      - name: Compilar y publicar
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Carpeta para compartir (instalador, extensión, LEEME y web)
        run: node scripts/build-public.js
      - uses: actions/upload-artifact@v4
        with:
          name: PM-Pollito-${{ github.ref_name }}
          path: public/
