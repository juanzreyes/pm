<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>🎯 Modo foco · PM Pollito</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 20px; }
    main { max-width: 440px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .chick { font-size: 72px; animation: bob 2s ease-in-out infinite; }
    h1 { font-size: 24px; justify-content: center; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { .chick { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="chick" aria-hidden="true">🐣</div>
    <h1>¡Estás en modo foco!</h1>
    <p><b id="host">Este sitio</b> puede esperar. <span id="left"></span></p>
    <div class="row"><button class="primary" id="back">↩ Volver al trabajo</button><button id="snooze">Dame 5 minutos</button></div>
    <p class="muted small">PM Pollito frena los sitios que distraen mientras dura tu foco. Puedes cambiar la lista en PM → Ajustes → Integraciones.</p>
  </main>
  <script src="lib.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
